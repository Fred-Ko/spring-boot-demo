# domains/customer/app/src/main/resources/application.yml

spring:
  datasource:
    url: jdbc:postgresql://localhost:5444/restaurant
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
