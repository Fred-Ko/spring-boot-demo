spring:
  application:
    name: customer-core

  datasource:
    url: jdbc:h2:mem:restaurantdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true